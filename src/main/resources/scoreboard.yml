    - '<text> Ping <muted><opponent_ping>ms'
    - ''
    - '<text>Hits <success><hits> <muted>vs <error><opponent_hits>'
    - '<text>Combo <accent><combo>'
    - '<text>Your ping <muted><ping>ms'
    - ''
    - '<text>Kit <kit> <muted>· <duration>'
    - '<dark_gray><st>                    </st> '
    - '<server>'
