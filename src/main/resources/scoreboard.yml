# Sidebar layouts. Every line is MiniMessage. Up to 15 lines per board.
# Colors <primary>, <accent>, <muted>, <text>, <success>, <error> come from messages.yml.
#
# Everywhere: <online> <in_queue> <in_fight> <player> <ping> <global_elo> <division> <season> <wins> <losses> <server>
# Queue: <kit> <queue_type> <queue_time> <elo>
# 1v1 match: <name> <health> <ping> <hits> <combo> <pots> and the same with an opponent_ prefix,
#            <hit_diff> <kit> <arena> <duration> <round> <target> <spectators>
# Spectating: p1_ and p2_ prefixes, e.g. <p1_name> <p1_health>
# Team match: <team_alive> <team_size> <enemy_alive> <enemy_size> <team_score> <enemy_score> <red_score> <blue_score>
# FFA: <alive> <total> <hits> <kills>
# Party: <party_leader> <party_size> <party_max>
# Event: <event> <event_kit> <event_players> <event_starts> <event_round>

enabled: true
title: '<gradient:#ff4f64:#ffb547><b>RIPOSTE</b></gradient>'
server-name: '<muted>play.example.net'

boards:
  lobby:
    - '<dark_gray><st>                    </st>'
    - '<text>Online <primary><online>'
    - '<text>Fighting <primary><in_fight>'
    - '<text>Queueing <primary><in_queue>'
    - ''
    - '<text>Rank <division>'
    - '<text>ELO <accent><global_elo>'
    - '<muted><season>'
    - '<dark_gray><st>                    </st> '
    - '<server>'
  party:
    - '<dark_gray><st>                    </st>'
    - '<text>Online <primary><online>'
    - '<text>Fighting <primary><in_fight>'
    - ''
    - '<accent>Party'
    - '<text> Leader <primary><party_leader>'
    - '<text> Members <primary><party_size><muted>/<party_max>'
    - '<dark_gray><st>                    </st> '
    - '<server>'
