    - '<text>Online <primary><online>'
    - '<text>Fighting <primary><in_fight>'
    - ''
    - '<accent><queue_type> Queue'
    - '<text> Kit <kit>'
    - '<text> Time <primary><queue_time>'
    - '<text> ELO <primary><elo>'
    - '<dark_gray><st>                    </st> '
    - '<server>'
  match:
