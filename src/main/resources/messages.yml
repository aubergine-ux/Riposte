# ---------------------------------------------------------------------------
#  Riposte messages. Everything here is MiniMessage: https://docs.advntr.dev/minimessage/format
#  The palette below becomes tags you can use anywhere (messages, menus, scoreboard):
#  <primary>, <accent>, <text>, <muted>, <success>, <error>
#  Lists send one chat line per entry. Empty strings disable a message.
# ---------------------------------------------------------------------------

colors:
  primary: '#ff4f64'
  accent: '#ffb547'
  text: '#e6e8ec'
  muted: '#8b93a1'
  success: '#4ade80'
  error: '#f87171'

prefix: '<dark_gray>[<gradient:#ff4f64:#ffb547>Riposte</gradient>]</dark_gray> '

errors:
  generic: '<prefix><error>Something went wrong. Try again in a moment.'
  profile-load: '<red>Your profile could not be loaded. Please try again in a moment.'
  player-offline: '<prefix><error><player> is not online.'
  unknown-kit: '<prefix><error>There is no kit called <white><kit></white>.'
  players-only: '<prefix><error>Only players can do that.'
  hold-item: '<prefix><error>Hold an item in your main hand first.'
  nothing-to-leave: '<prefix><muted>You are not in a queue, event or match you can leave.'

lobby:
  welcome:
    - ''
    - '  <gradient:#ff4f64:#ffb547><b>RIPOSTE</b></gradient> <muted>· PvP practice'
    - '  <text>Welcome, <primary><player></primary>. Right click the <accent>swords</accent> to queue,'
    - '  <text>or <accent>/duel \<name></accent> someone. <muted>/riposte help for more.'
    - ''

setup:
  reminder: '<prefix><accent>Riposte is not set up yet.</accent> <text>Stand where the lobby should be and run <click:suggest_command:/riposte setup><primary><u>/riposte setup</u></primary></click>.'
  lobby: '<prefix><success>Lobby set to your position.'
  done:
    - '<prefix><success>Setup complete.</success> <text>Generated <primary><count></primary> arenas; copies are being pasted now.'
    - '<prefix><text>Players can queue right away with the swords in their hotbar.'
    - '<prefix><muted>Build your own arenas any time with <white>/arena wand</white>.'
  nothing: '<prefix><muted>Lobby and arenas already exist. Nothing to do.'
  names:
    classic: '<#c9d1d9>Classic'
    sumo: '<#5ee6a8>Sumo Ring'
    bridge: '<#4da3ff>The Bridge'

help:
  player:
    - '<dark_gray><st>                                                  </st>'
    - ' <gradient:#ff4f64:#ffb547><b>RIPOSTE</b></gradient> <muted>v<version>'
    - ' <primary>/queue</primary> <muted>[unranked|ranked] [kit]</muted> <text>· join a queue'
    - ' <primary>/duel</primary> <muted><player> [kit]</muted> <text>· challenge someone'
    - ' <primary>/rematch</primary> <text>· rematch your last opponent'
    - ' <primary>/spectate</primary> <muted>[player]</muted> <text>· watch a live match'
    - ' <primary>/party</primary> <muted>create|invite|ffa|split</muted> <text>· parties'
    - ' <primary>/event</primary> <muted>join|leave</muted> <text>· hosted events'
    - ' <primary>/stats</primary> <muted>[player]</muted> <text>· stats and ELO history'
    - ' <primary>/leaderboard</primary> <muted>[kit]</muted> <text>· top players'
    - ' <primary>/kiteditor</primary> <muted>[kit]</muted> <text>· rearrange a kit'
    - ' <primary>/settings</primary> <text>· duel requests, scoreboard, time'
    - '<dark_gray><st>                                                  </st>'
  admin:
    - '<dark_gray><st>                                                  </st>'
    - ' <gradient:#ff4f64:#ffb547><b>RIPOSTE</b></gradient> <muted>v<version> · admin'
    - ' <primary>/riposte setup</primary> <text>· lobby and three ready arenas'
    - ' <primary>/riposte setlobby</primary> <text>· move the lobby here'
    - ' <primary>/riposte reload</primary> <text>· reload configs'
    - ' <primary>/riposte build</primary> <text>· toggle build mode'
    - ' <primary>/riposte status</primary> <text>· matches, queues, arenas, tick time'
    - ' <primary>/riposte season new</primary> <muted><soft|hard> <name></muted>'
    - ' <primary>/riposte hologram</primary> <muted>create|delete|list</muted>'
    - ' <primary>/arena</primary> <text>· arena setup <muted>(/arena for details)'
    - ' <primary>/kit</primary> <text>· kit setup <muted>(/kit for details)'
    - ' <primary>/event host</primary> <muted><tournament|sumo> [kit]</muted>'
    - ' <muted>Player commands: /queue /duel /spectate /party /stats /leaderboard'
    - '<dark_gray><st>                                                  </st>'
  arena:
    - '<dark_gray><st>                                                  </st>'
    - ' <primary><b>Arena setup</b></primary>'
    - ' <text>1. <primary>/arena wand</primary>, left and right click two corners'
    - ' <text>2. <primary>/arena create <name></primary> <muted>(uses your selection)'
    - ' <text>3. <primary>/arena setspawn <name> 1</primary> and <primary>2</primary> where players start'
    - ' <text>4. <primary>/arena copies <name> <n></primary> then <primary>/arena enable <name></primary>'
    - ' <muted>Also: list, info, tags, icon, displayname, setgoal, setregion, paste, disable, delete, tp'
    - ' <muted>Or generate one: /arena generate <name> <classic|sumo|bridge> [copies]'
    - '<dark_gray><st>                                                  </st>'
  kit:
    - '<dark_gray><st>                                                  </st>'
    - ' <primary><b>Kit setup</b></primary>'
    - ' <primary>/kit list</primary> <text>· all kits'
    - ' <primary>/kit give <kit></primary> <text>· load a kit to edit it'
    - ' <primary>/kit setinv <kit></primary> <text>· save your inventory as the kit'
    - ' <primary>/kit seticon <kit></primary> <text>· icon from your hand'
    - ' <primary>/kit create|delete|enable|disable|restore</primary>'
    - ' <muted>Rules (hunger, build, rounds, win condition...) live in kits.yml.'
    - '<dark_gray><st>                                                  </st>'

admin:
  reloaded: '<prefix><success>Configuration reloaded.'
  lobby-set: '<prefix><success>Lobby set to your position.'
