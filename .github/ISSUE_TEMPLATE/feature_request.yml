name: Feature request
description: Suggest an idea or improvement for Riposte.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you are trying to do on your server and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: fair-play
    attributes:
      label: Fair play
      options:
        - label: This does not give any player an unfair advantage (Riposte does not add cheating features).
          required: true
