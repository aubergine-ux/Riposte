name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build -Pversion="${GITHUB_REF_NAME#v}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          notes=".github/release-notes/$tag.md"
          if ! gh release view "$tag" > /dev/null 2>&1; then
            if [ -f "$notes" ]; then
              gh release create "$tag" --title "Riposte $tag" --notes-file "$notes" --verify-tag
            else
              gh release create "$tag" --title "Riposte $tag" --generate-notes --verify-tag
            fi
          fi
          gh release upload "$tag" build/libs/Riposte-*.jar --clobber
